services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/backend_tasks
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-real-life
    depends_on:
      - mongo
      - redis
    volumes:
      - uploads:/app/uploads

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine

volumes:
  mongo-data:
  uploads:

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --border:#d1d5db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111827; --card:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --accent:#3b82f6; --border:#374151; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  .card { background:var(--card); padding:2rem; border-radius:12px; width:min(92vw,420px); box-shadow:0 4px 20px rgba(0,0,0,.12); }
  h1 { margin-top:0; font-size:1.4rem; }
  p { color:var(--muted); }
  b { color:var(--text); }
  button { padding:.6rem 1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; font-size:1rem; margin-top:1rem; }
</style>
</head>
<body>
<div class="card" id="card" hidden>
  <h1>Welcome, <span id="name"></span></h1>
  <p>Email: <b id="email"></b></p>
  <p>Role: <b id="role"></b></p>
  <button id="logout">Logout</button>
</div>

<script>
  // Protected page: needs a valid token, otherwise back to login
  const token = localStorage.getItem('token');
  if (!token) location.replace('/index.html');

  fetch('/api/auth/profile', { headers: { Authorization: 'Bearer ' + token } })
    .then(async (res) => {
      if (!res.ok) throw new Error('unauthorized');
      const { user } = await res.json();
      document.getElementById('name').textContent = user.name;
      document.getElementById('email').textContent = user.email;
      document.getElementById('role').textContent = user.role;
      document.getElementById('card').hidden = false;
    })
    .catch(() => {
      localStorage.removeItem('token');
      location.replace('/index.html');
    });

  document.getElementById('logout').onclick = async () => {
    await fetch('/api/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
    localStorage.removeItem('token');
    location.replace('/index.html');
  };
</script>
</body>
</html>
